name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Optional cross-check library
        run: python -m pip install olefile
      - name: LibreOffice and bubblewrap (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc libreoffice-impress bubblewrap
      - name: Allow unprivileged user namespaces for bwrap (Ubuntu 24.04 AppArmor default blocks them)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: python tests/smoke_test.py
      - name: Package file list
        if: runner.os == 'Linux' && matrix.python == '3.13'
        run: npm pack --dry-run
